<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁感线交互可视化</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }
        p {
            margin: 0;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>磁感线可视化</h1>
        <p>用鼠标拖动条形磁铁查看磁场变化</p>
        <a href="https://github.com/guoxinghao123/Visualization-of-magnetic-field-lines.git" target="_blank">源码地址</a>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const GRID_SIZE = 40; // 磁针的间距
        const NEEDLE_LENGTH = 40; // 磁针的长度

        // 条形磁铁的属性
        let magnet = {
            x: 0,
            y: 0,
            w: 160,
            h: 40,
            angle: 0,
            isDragging: false
        };

        // 调整画布大小
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (!magnet.isDragging && magnet.x === 0) {
                magnet.x = width / 2;
                magnet.y = height / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // 鼠标/触摸交互逻辑
        let mouseX = 0;
        let mouseY = 0;
        let offsetX = 0;
        let offsetY = 0;

        function startDrag(x, y) {
            // 简单碰撞检测（判断点击是否在磁铁大致范围内）
            if (x > magnet.x - magnet.w/2 && x < magnet.x + magnet.w/2 &&
                y > magnet.y - magnet.h/2 && y < magnet.y + magnet.h/2) {
                magnet.isDragging = true;
                offsetX = x - magnet.x;
                offsetY = y - magnet.y;
            }
        }

        function drag(x, y) {
            if (magnet.isDragging) {
                magnet.x = x - offsetX;
                magnet.y = y - offsetY;
            }
        }

        function endDrag() {
            magnet.isDragging = false;
        }

        // 鼠标事件
        canvas.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
        canvas.addEventListener('mousemove', e => drag(e.clientX, e.clientY));
        window.addEventListener('mouseup', endDrag);

        // 触摸事件
        canvas.addEventListener('touchstart', e => startDrag(e.touches[0].clientX, e.touches[0].clientY));
        canvas.addEventListener('touchmove', e => drag(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchend', endDrag);

        // 计算磁场强度和方向 (使用两个磁单极子的叠加作为近似)
        function getMagneticField(x, y) {
            // N极和S极在世界坐标系中的实际位置
            const poleDist = magnet.w / 2 * 0.8; // 磁极稍微靠内一点
            
            const nX = magnet.x + Math.cos(magnet.angle) * poleDist;
            const nY = magnet.y + Math.sin(magnet.angle) * poleDist;
            
            const sX = magnet.x - Math.cos(magnet.angle) * poleDist;
            const sY = magnet.y - Math.sin(magnet.angle) * poleDist;

            // 计算该点到N极的向量 (N极向外辐射)
            const dxN = x - nX;
            const dyN = y - nY;
            const distN = Math.sqrt(dxN * dxN + dyN * dyN) || 1;
            
            // 计算该点到S极的向量 (S极向内汇聚)
            const dxS = x - sX;
            const dyS = y - sY;
            const distS = Math.sqrt(dxS * dxS + dyS * dyS) || 1;

            // 磁场强度公式: B = q / r^2。分量 Bx = B * (dx/r) = q * dx / r^3
            const strength = 50000; 
            
            let Bx = strength * (dxN / Math.pow(distN, 3)) - strength * (dxS / Math.pow(distS, 3));
            let By = strength * (dyN / Math.pow(distN, 3)) - strength * (dyS / Math.pow(distS, 3));

            return { Bx, By };
        }

        // 绘制主循环
        function draw() {
            ctx.clearRect(0, 0, width, height);

            // 让磁铁缓慢旋转，增加一点动态效果（如果不需要可以注释掉这一行）
            if (!magnet.isDragging) {
                magnet.angle += 0.005;
            }

            // 1. 绘制背景网格和小磁针
            for (let x = GRID_SIZE/2; x < width; x += GRID_SIZE) {
                for (let y = GRID_SIZE/2; y < height; y += GRID_SIZE) {
                    const field = getMagneticField(x, y);
                    const angle = Math.atan2(field.By, field.Bx);
                    
                    // 计算磁场强度大小（用于透明度或颜色变化）
                    const magnitude = Math.sqrt(field.Bx * field.Bx + field.By * field.By);
                    const alpha = Math.min(1, Math.max(0.2, magnitude * 0.05));

                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(angle);

                    // 绘制小磁针 (红色代表指向S极的N极方向，白色代表指向N极的S极方向)
                    ctx.globalAlpha = alpha;
                    
                    // N极 (红)
                    ctx.fillStyle = '#ff4444';
                    ctx.beginPath();
                    ctx.moveTo(0, -2);
                    ctx.lineTo(NEEDLE_LENGTH/2, 0);
                    ctx.lineTo(0, 2);
                    ctx.fill();

                    // S极 (白)
                    ctx.fillStyle = '#0055ff';
                    ctx.beginPath();
                    ctx.moveTo(0, -2);
                    ctx.lineTo(-NEEDLE_LENGTH/2, 0);
                    ctx.lineTo(0, 2);
                    ctx.fill();

                    ctx.restore();
                }
            }

            // 2. 绘制条形磁铁
            ctx.save();
            ctx.translate(magnet.x, magnet.y);
            ctx.rotate(magnet.angle);

            // 画阴影
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 5;

            // 画磁铁主体 (左边南极，右边北极)
            // S极 (蓝)
            ctx.fillStyle = '#0055ff';
            ctx.fillRect(-magnet.w/2, -magnet.h/2, magnet.w/2, magnet.h);
            
            // N极 (红)
            ctx.fillStyle = '#ff1111';
            ctx.fillRect(0, -magnet.h/2, magnet.w/2, magnet.h);

            // 画 N/S 字母
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'transparent'; // 文字不需要阴影
            
            // 调整由于旋转导致的文字颠倒问题
            ctx.save();
            ctx.translate(-magnet.w/4, 0);
            if(Math.cos(magnet.angle) < 0) ctx.rotate(Math.PI);
            ctx.fillText('S', 0, 0);
            ctx.restore();

            ctx.save();
            ctx.translate(magnet.w/4, 0);
            if(Math.cos(magnet.angle) < 0) ctx.rotate(Math.PI);
            ctx.fillText('N', 0, 0);
            ctx.restore();

            ctx.restore();

            requestAnimationFrame(draw);
        }

        // 启动循环
        draw();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁感线交互可视化</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            pointer-events: auto; /* 确保可以点击 UI */
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #444;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }
        p {
            margin: 0 0 15px 0;
            font-size: 14px;
            color: #ccc;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            font-size: 15px;
            cursor: pointer;
        }
        .toggle-container input {
            margin-right: 8px;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
        /* 避免拖动磁铁时选中文字 */
        * {
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>磁感线可视化演示</h1>
        <p>用鼠标拖动条形磁铁查看磁场变化</p>
        <br>
        <label class="toggle-container">
            <input type="checkbox" id="modeSwitch">
            点击切换为连续磁感线
        </label>
        <br>
        <h4>单击此处查看源代码
            <a href="https://github.com/guoxinghao123/Visualization-of-magnetic-field-lines" target="_blank">
                @guoxinghao123
            </a>
        </h4>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const modeSwitch = document.getElementById('modeSwitch');

        let width, height;
        const GRID_SIZE = 30; // 磁针的间距
        const NEEDLE_LENGTH = 30; // 磁针的长度

        // 条形磁铁的属性
        let magnet = {
            x: 0,
            y: 0,
            w: 160,
            h: 40,
            angle: 0,
            isDragging: false
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (!magnet.isDragging && magnet.x === 0) {
                magnet.x = width / 2;
                magnet.y = height / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // 交互逻辑
        let offsetX = 0;
        let offsetY = 0;

        function startDrag(x, y) {
            if (x > magnet.x - magnet.w/2 && x < magnet.x + magnet.w/2 &&
                y > magnet.y - magnet.h/2 && y < magnet.y + magnet.h/2) {
                magnet.isDragging = true;
                offsetX = x - magnet.x;
                offsetY = y - magnet.y;
            }
        }

        function drag(x, y) {
            if (magnet.isDragging) {
                magnet.x = x - offsetX;
                magnet.y = y - offsetY;
            }
        }

        function endDrag() {
            magnet.isDragging = false;
        }

        canvas.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
        canvas.addEventListener('mousemove', e => drag(e.clientX, e.clientY));
        window.addEventListener('mouseup', endDrag);

        canvas.addEventListener('touchstart', e => startDrag(e.touches[0].clientX, e.touches[0].clientY));
        canvas.addEventListener('touchmove', e => drag(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchend', endDrag);

        // 计算某一点的磁场向量
        function getMagneticField(x, y) {
            const poleDist = magnet.w / 2 * 0.8;
            
            const nX = magnet.x + Math.cos(magnet.angle) * poleDist;
            const nY = magnet.y + Math.sin(magnet.angle) * poleDist;
            
            const sX = magnet.x - Math.cos(magnet.angle) * poleDist;
            const sY = magnet.y - Math.sin(magnet.angle) * poleDist;

            const dxN = x - nX;
            const dyN = y - nY;
            const distN = Math.sqrt(dxN * dxN + dyN * dyN) || 1;
            
            const dxS = x - sX;
            const dyS = y - sY;
            const distS = Math.sqrt(dxS * dxS + dyS * dyS) || 1;

            const strength = 50000; 
            
            let Bx = strength * (dxN / Math.pow(distN, 3)) - strength * (dxS / Math.pow(distS, 3));
            let By = strength * (dyN / Math.pow(distN, 3)) - strength * (dyS / Math.pow(distS, 3));

            return { Bx, By, nX, nY, sX, sY };
        }

        // 绘制：散点磁针网格
        function drawNeedleGrid() {
            for (let x = GRID_SIZE/2; x < width; x += GRID_SIZE) {
                for (let y = GRID_SIZE/2; y < height; y += GRID_SIZE) {
                    const field = getMagneticField(x, y);
                    const angle = Math.atan2(field.By, field.Bx);
                    
                    const magnitude = Math.sqrt(field.Bx * field.Bx + field.By * field.By);
                    const alpha = Math.min(1, Math.max(0.15, magnitude * 0.05));

                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(angle);

                    ctx.globalAlpha = alpha;
                    
                    // N极 (红)
                    ctx.fillStyle = '#ff4444';
                    ctx.beginPath();
                    ctx.moveTo(0, -2);
                    ctx.lineTo(NEEDLE_LENGTH/2, 0);
                    ctx.lineTo(0, 2);
                    ctx.fill();

                    // S极 (蓝) 
                    ctx.fillStyle = '#0055ff'; 
                    ctx.beginPath();
                    ctx.moveTo(0, -2);
                    ctx.lineTo(-NEEDLE_LENGTH/2, 0);
                    ctx.lineTo(0, 2);
                    ctx.fill();

                    ctx.restore();
                }
            }
        }

        // 绘制：连续的磁感线与箭头
        function drawContinuousLines() {
            // 获取磁极位置
            const fieldInfo = getMagneticField(0, 0); 
            const nX = fieldInfo.nX;
            const nY = fieldInfo.nY;
            const sX = fieldInfo.sX;
            const sY = fieldInfo.sY;

            const numLines = 60; // 发射出的磁感线数量
            const stepSize = 5;  // 积分步长（越小越平滑，但计算量大）
            const maxSteps = 800; // 防止陷入死循环的最大延伸距离

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1.5;

            // 以 N 极为圆心，向外发出磁感线 (数值积分法)
            for (let i = 0; i < numLines; i++) {
                const startAngle = (Math.PI * 2 / numLines) * i;
                
                // 起点稍微偏离 N 极中心一点，防止分母为零引发奇点导致计算爆炸
                let cx = nX + Math.cos(startAngle) * 8;
                let cy = nY + Math.sin(startAngle) * 8;

                let path = [];
                
                // 沿着磁场方向逐步追踪路径
                for (let step = 0; step < maxSteps; step++) {
                    const field = getMagneticField(cx, cy);
                    const mag = Math.sqrt(field.Bx * field.Bx + field.By * field.By);
                    
                    if (mag < 1e-6) break; // 磁场过弱停止追踪

                    // 标准化向量后乘以步长
                    const dx = (field.Bx / mag) * stepSize;
                    const dy = (field.By / mag) * stepSize;

                    cx += dx;
                    cy += dy;
                    
                    path.push({ x: cx, y: cy, angle: Math.atan2(dy, dx) });

                    // 碰撞检测：如果接近 S 极，则这条线算是“封闭回去了”，停止
                    const distToS = Math.hypot(cx - sX, cy - sY);
                    if (distToS < 10) break;

                    // 优化：超出屏幕太远就不用算了
                    if (cx < -300 || cx > width + 300 || cy < -300 || cy > height + 300) break;
                }

                // 绘制提取出的线段
                if (path.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(path[0].x, path[0].y);
                    for (let p of path) {
                        ctx.lineTo(p.x, p.y);
                    }
                    ctx.stroke();

                    // 沿着路径每隔一段距离画一个箭头
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    for (let j = 20; j < path.length - 15; j += 35) {
                        const pt = path[j];
                        ctx.save();
                        ctx.translate(pt.x, pt.y);
                        ctx.rotate(pt.angle);
                        ctx.beginPath();
                        ctx.moveTo(-5, -4);  // 箭头尾部上侧
                        ctx.lineTo(5, 0);    // 箭头尖端
                        ctx.lineTo(-5, 4);   // 箭头尾部下侧
                        ctx.fill();
                        ctx.restore();
                    }
                }
            }
        }

        // 绘制主循环
        function draw() {
            ctx.clearRect(0, 0, width, height);

            if (!magnet.isDragging && !modeSwitch.checked) {
                magnet.angle += 0.003;
            }

            // 1. 根据复选框状态渲染背景场
            if (modeSwitch.checked) {
                drawContinuousLines();
            } else {
                drawNeedleGrid();
            }

            // 2. 绘制条形磁铁 (在最上层)
            ctx.save();
            ctx.translate(magnet.x, magnet.y);
            ctx.rotate(magnet.angle);

            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 5;

            // S极 (蓝)
            ctx.fillStyle = '#0055ff';
            ctx.fillRect(-magnet.w/2, -magnet.h/2, magnet.w/2, magnet.h);
            
            // N极 (红)
            ctx.fillStyle = '#ff1111';
            ctx.fillRect(0, -magnet.h/2, magnet.w/2, magnet.h);

            // N/S 字母
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'transparent';
            
            ctx.save();
            ctx.translate(-magnet.w/4, 0);
            if(Math.cos(magnet.angle) < 0) ctx.rotate(Math.PI);
            ctx.fillText('S', 0, 0);
            ctx.restore();

            ctx.save();
            ctx.translate(magnet.w/4, 0);
            if(Math.cos(magnet.angle) < 0) ctx.rotate(Math.PI);
            ctx.fillText('N', 0, 0);
            ctx.restore();

            ctx.restore();

            requestAnimationFrame(draw);
        }

        // 启动
        draw();
    </script>
</body>
</html>
